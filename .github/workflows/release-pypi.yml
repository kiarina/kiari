name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write
    id-token: write # For trusted publishing to PyPI

jobs:
    build-and-publish:
        name: Build and publish to PyPI
        runs-on: ubuntu-latest
        environment: pypi
        env:
            MISE_GITHUB_ATTESTATIONS: "false"
            NO_COLOR: "1"

        steps:
            - uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg

            - name: Install mise
              uses: jdx/mise-action@v4.2.3
              with:
                  version: 2026.5.0
                  cache: true
                  install: false

            - name: Setup Python via mise
              run: |
                  mise use python@3.13
                  mise install

            - name: Install dependencies
              run: |
                  mise exec -- uv sync --all-extras --all-groups

            - name: Download test assets
              run: mise run test-assets:download

            - name: Run CI checks
              run: mise run ci

            - name: Build package
              run: mise run build

            - name: Extract release notes from CHANGELOG
              id: changelog
              run: |
                  # Extract version from tag (remove 'v' prefix)
                  VERSION=${GITHUB_REF_NAME#v}
                  echo "Version: $VERSION"

                  # Use mise task to extract changelog
                  if mise run changelog:extract "$VERSION" --output /tmp/release_notes.md; then
                    echo "use_auto_notes=false" >> $GITHUB_OUTPUT
                    echo "Release notes preview:"
                    echo "---"
                    cat /tmp/release_notes.md
                    echo "---"
                  else
                    echo "No changelog entry found for version $VERSION, using auto-generated notes"
                    echo "use_auto_notes=true" >> $GITHUB_OUTPUT
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      dist/*.tar.gz
                      dist/*.whl
                  body_path: ${{ steps.changelog.outputs.use_auto_notes == 'false' && '/tmp/release_notes.md' || '' }}
                  generate_release_notes: ${{ steps.changelog.outputs.use_auto_notes == 'true' }}
                  draft: false
                  prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
                  skip-existing: true
                  verbose: true
