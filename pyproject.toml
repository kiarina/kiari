[project]
name = "kiari"
version = "0.2.0"
description = "A CLI tool for developing and experimenting with qualia-oriented LLM agents"
authors = [
    { name = "kiarina", email = "kiarinadawa@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["llm", "agent", "cli", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiofiles>=25.1.0,<26",
    "aiohttp>=3.12.0,<4",
    "click>=8.2.1,<9",
    "chrome-bridge-sdk>=0.4,<0.5",
    "croniter>=6.0.0,<7",
    "fastapi>=0.133.0,<1",
    "google-cloud-pubsub>=2.31.1,<3",
    "google-cloud-storage>=3.4.0,<4",
    "httpx>=0.28.1,<1.0.0",
    "kiarina[all]>=2.25.0",
    "mss>=10.0.0,<11",
    "numpy>=2.0,<3",
    "pillow>=11.3.0,<13",
    "prompt-toolkit>=3.0.51,<4",
    "puremagic>=1.30,<3",
    "pyautogui>=0.9.54,<1",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "pydantic-settings-manager>=2.5.1",
    "pydub>=0.25.1,<1",
    "pyperclip>=1.9.0,<2",
    "PyYAML>=6.0.2,<7",
    "questionary>=2.1.1,<3",
    "rich>=14.1.0,<16",
    "rich-click>=1.9.7",
    "slack-bolt>=1.23.0,<2",
    "slack-sdk>=3.36.0,<4",
    "sounddevice>=0.5.3,<1",
    "soundfile>=0.13.1",
    "streamlit[auth]>=1.59.0,<2",
    "tzlocal>=5.3.1,<6",
    "uvicorn>=0.35.0,<1",
    "watchfiles>=1.1.1,<2",
    "audioop-lts>=0.2.2 ; python_full_version >= '3.13'",
]

[project.urls]
homepage = "https://github.com/kiarina/kiari"
repository = "https://github.com/kiarina/kiari"
documentation = "https://github.com/kiarina/kiari"

[project.scripts]
kiari = "kiari.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiari"]

[tool.hatch.build.targets.sdist]
include = [
    "/kiari",
    "/tests",
    "/README.md",
    "/README.ja.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.mypy]
python_version = "3.12"
show_error_codes = true
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
log_cli = true
markers = [
    "ignore: skip in recurring runs",
    "costly: marks tests with higher external cost",
]

[tool.coverage.run]
branch = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long: let the formatter handle it (ignore long strings/comments)
    "B008",   # function call in argument defaults: required for FastAPI Depends()
    "RUF022", # unsorted __all__: keep intentional comment-based grouping
]

[tool.ruff.lint.isort]
known-first-party = ["kiari"]
combine-as-imports = true

[dependency-groups]
test = [
    "pytest>=9.0.1,<10",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0,<8",
    "pytest-once>=0.1.0,<1",
    "pytest-rerunfailures>=16.0.1,<17",
    "pytest-timeout>=2.4.0,<3",
    "pytest-xdist>=3.8.0,<4",
]
lint = [
    "mypy>=1.17.1,<3",
    "ruff>=0.15.0,<1",
    "types-aiofiles>=25.1.0.20251011",
    "types-croniter>=6.0.0.20250809",
    "types-pyautogui>=0.9.3.20241230",
    "types-pygments>=2.19.0.20250809",
    "types-pyyaml>=6.0.12.20250809",
]
dev = [
    "ipykernel>=7.0.0,<8",
    "ipywidgets>=8.1.7,<9",
    "mypy>=1.17.1,<3",
    "pytest>=9.0.1,<10",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0,<8",
    "pytest-once>=0.1.0,<1",
    "pytest-rerunfailures>=16.0.1,<17",
    "pytest-timeout>=2.4.0,<3",
    "pytest-xdist>=3.8.0,<4",
    "ruff>=0.15.0,<1",
    "types-aiofiles>=25.1.0.20251011",
    "types-croniter>=6.0.0.20250809",
    "types-pyautogui>=0.9.3.20241230",
    "types-pygments>=2.19.0.20250809",
    "types-pyyaml>=6.0.12.20250809",
]
